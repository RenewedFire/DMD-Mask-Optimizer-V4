[project]
name = "dmd-mask-optimizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = [
    "pytest==9.2.0",
    "colorama==0.4.6; sys_platform == 'win32'",
    "iniconfig==2.3.1",
    "jsonschema==4.25.1",
    "packaging==26.3",
    "pluggy==1.7.0",
    "pygments==2.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["dmd_optimizer*", "scripts"]
